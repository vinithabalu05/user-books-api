<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - User & Books Management</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }


        /* ================================
           HEADER
        ================================= */

        .header {

            height: 72px;

            background: white;

            border-bottom:
                1px solid #e2e8f0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 21px;

            font-weight: bold;

            color: #1e293b;
        }


        .brand-icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #7c3aed
                );

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-size: 22px;
        }


        .header-right {

            display: flex;

            align-items: center;

            gap: 15px;
        }


        .admin-badge {

            background: #fef3c7;

            color: #92400e;

            padding: 8px 14px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;
        }


        .logout-btn {

            border: none;

            background: #ef4444;

            color: white;

            padding: 10px 17px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }


        .logout-btn:hover {

            background: #dc2626;
        }


        /* ================================
           MAIN
        ================================= */

        .main {

            max-width: 1250px;

            margin: auto;

            padding: 40px;
        }


        .welcome {

            margin-bottom: 30px;
        }


        .welcome h1 {

            font-size: 32px;

            margin-bottom: 8px;
        }


        .welcome p {

            color: #64748b;

            font-size: 16px;
        }


        /* ================================
           MESSAGE
        ================================= */

        .message {

            display: none;

            margin-bottom: 20px;

            padding: 13px 16px;

            border-radius: 8px;

            font-size: 14px;
        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;
        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #991b1b;
        }


        /* ================================
           STATISTICS
        ================================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }


        .stat-card {

            background: white;

            border-radius: 15px;

            padding: 25px;

            border:
                1px solid #e2e8f0;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.04);
        }


        .stat-icon {

            font-size: 28px;

            margin-bottom: 12px;
        }


        .stat-card h3 {

            color: #64748b;

            font-size: 14px;

            margin-bottom: 8px;
        }


        .stat-card .number {

            font-size: 30px;

            font-weight: bold;

            color: #1e293b;
        }


        /* ================================
           SECTION
        ================================= */

        .section {

            background: white;

            border-radius: 15px;

            border:
                1px solid #e2e8f0;

            margin-bottom: 25px;

            overflow: hidden;
        }


        .section-header {

            padding: 22px 25px;

            border-bottom:
                1px solid #e2e8f0;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .section-header h2 {

            font-size: 20px;
        }


        .refresh-btn {

            border:
                1px solid #cbd5e1;

            background: white;

            color: #334155;

            padding: 9px 15px;

            border-radius: 8px;

            cursor: pointer;
        }


        .refresh-btn:hover {

            background: #f8fafc;
        }


        /* ================================
           TABLE
        ================================= */

        .table-container {

            overflow-x: auto;
        }


        table {

            width: 100%;

            border-collapse: collapse;
        }


        th {

            text-align: left;

            background: #f8fafc;

            color: #475569;

            font-size: 13px;

            padding: 15px 20px;

            border-bottom:
                1px solid #e2e8f0;
        }


        td {

            padding: 15px 20px;

            border-bottom:
                1px solid #f1f5f9;

            font-size: 14px;
        }


        tr:hover td {

            background: #fafafa;
        }


        /* ================================
           ROLE BADGES
        ================================= */

        .role-user {

            background: #dbeafe;

            color: #1d4ed8;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;
        }


        .role-admin {

            background: #fef3c7;

            color: #92400e;

            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;
        }


        /* ================================
           DELETE BUTTON
        ================================= */

        .delete-btn {

            border: none;

            background: #fee2e2;

            color: #b91c1c;

            padding: 7px 12px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }


        .delete-btn:hover {

            background: #fecaca;
        }


        .delete-btn:disabled {

            background: #e2e8f0;

            color: #94a3b8;

            cursor: not-allowed;
        }


        /* ================================
           EMPTY
        ================================= */

        .empty {

            text-align: center;

            color: #64748b;

            padding: 30px;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 800px) {

            .header {

                padding: 0 20px;
            }


            .brand {

                font-size: 17px;
            }


            .admin-badge {

                display: none;
            }


            .main {

                padding: 25px 15px;
            }


            .stats {

                grid-template-columns: 1fr;
            }


            .welcome h1 {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<!-- ==================================================
     HEADER
=================================================== -->

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            📚
        </div>

        User & Books Management

    </div>


    <div class="header-right">

        <span class="admin-badge">

            👑 ADMIN

        </span>


        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    </div>

</header>


<!-- ==================================================
     MAIN
=================================================== -->

<main class="main">


    <!-- WELCOME -->

    <div class="welcome">

        <h1>
            👑 Admin Dashboard
        </h1>

        <p>
            Manage registered users and books
            from the administration panel.
        </p>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">

    </div>


    <!-- ==================================================
         STATISTICS
    =================================================== -->

    <div class="stats">


        <!-- USERS -->

        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <h3>
                Total Users
            </h3>

            <div
                class="number"
                id="userCount">

                0

            </div>

        </div>


        <!-- BOOKS -->

        <div class="stat-card">

            <div class="stat-icon">
                📚
            </div>

            <h3>
                Total Books
            </h3>

            <div
                class="number"
                id="bookCount">

                0

            </div>

        </div>


        <!-- ACCESS -->

        <div class="stat-card">

            <div class="stat-icon">
                🔐
            </div>

            <h3>
                Access Level
            </h3>

            <div
                class="number"
                style="font-size:22px;">

                ADMIN

            </div>

        </div>


    </div>


    <!-- ==================================================
         USERS SECTION
    =================================================== -->

    <section class="section">


        <div class="section-header">

            <h2>
                👥 Registered Users
            </h2>


            <button
                class="refresh-btn"
                onclick="loadData()">

                🔄 Refresh

            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="usersTable">

                    <tr>

                        <td
                            colspan="4"
                            class="empty">

                            Loading users...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- ==================================================
         BOOKS SECTION
    =================================================== -->

    <section class="section">


        <div class="section-header">

            <h2>
                📚 All Books
            </h2>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            Book Title
                        </th>

                        <th>
                            User ID
                        </th>

                    </tr>

                </thead>


                <tbody id="booksTable">

                    <tr>

                        <td
                            colspan="3"
                            class="empty">

                            Loading books...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


</main>


<script>


    // ==================================================
    // API CONFIGURATION
    // ==================================================

    const API_URL =
        "http://localhost:3000";


    // ==================================================
    // GET LOGIN INFORMATION
    // ==================================================

    const token =
        localStorage.getItem(
            "accessToken"
        );


    const savedRole =
        localStorage.getItem(
            "userRole"
        );


    // ==================================================
    // FRONTEND ADMIN PROTECTION
    // ==================================================

    if (!token) {

        window.location.href =
            "index.html";

    }


    if (savedRole !== "ADMIN") {

        window.location.href =
            "dashboard.html";

    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHTML(value) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value ?? "";


        return div.innerHTML;

    }


    // ==================================================
    // SHOW MESSAGE
    // ==================================================

    function showMessage(
        message,
        type
    ) {

        const box =
            document.getElementById(
                "message"
            );


        box.textContent =
            message;


        box.className =
            "message " + type;

    }


    // ==================================================
    // SAFE API REQUEST
    // ==================================================
    //
    // This function first reads the response as text.
    //
    // Then it checks whether the response is JSON.
    //
    // This prevents:
    //
    // Unexpected token '<'
    //
    // when Express returns an HTML page.
    //
    // ==================================================

    async function apiRequest(
        url,
        options = {}
    ) {

        const response =
            await fetch(
                url,
                options
            );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        const responseText =
            await response.text();


        let data;


        // ----------------------------------------------
        // JSON RESPONSE
        // ----------------------------------------------

        if (
            contentType.includes(
                "application/json"
            )
        ) {

            try {

                data =
                    JSON.parse(
                        responseText
                    );

            }
            catch (error) {

                throw new Error(
                    "Server returned invalid JSON."
                );

            }

        }


        // ----------------------------------------------
        // NON-JSON RESPONSE
        // ----------------------------------------------

        else {

            console.error(
                "Non-JSON response from:",
                url
            );


            console.error(
                "Response:",
                responseText
            );


            if (
                response.status === 404
            ) {

                throw new Error(
                    `API endpoint not found: ${url}`
                );

            }


            if (
                response.status === 401
            ) {

                throw new Error(
                    "Access token is missing or expired."
                );

            }


            if (
                response.status === 403
            ) {

                throw new Error(
                    "Admin access required."
                );

            }


            throw new Error(
                `Server returned ${response.status} instead of JSON.`
            );

        }


        return {

            response,

            data

        };

    }


    // ==================================================
    // LOAD ADMIN DATA
    // ==================================================

    async function loadData() {

        try {


            showMessage(
                "Loading admin data...",
                "success"
            );


            // ==================================================
            // 1. VERIFY PROFILE
            // ==================================================

            const profileResult =
                await apiRequest(
                    `${API_URL}/api/profile`,
                    {

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            const profile =
                profileResult.data;


            // ==================================================
            // VERIFY ADMIN ROLE FROM BACKEND
            // ==================================================

            if (
                profile.role !== "ADMIN"
            ) {

                localStorage.clear();


                window.location.href =
                    "dashboard.html";


                return;

            }


            // ==================================================
            // 2. GET USERS
            // ==================================================

            const usersResult =
                await apiRequest(
                    `${API_URL}/api/users`,
                    {

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            const usersData =
                usersResult.data;


            // ==================================================
            // 3. GET BOOKS
            // ==================================================

            const booksResult =
                await apiRequest(
                    `${API_URL}/api/books`,
                    {

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            const booksData =
                booksResult.data;


            // ==================================================
            // 4. DISPLAY DATA
            // ==================================================

            displayUsers(
                usersData
            );


            displayBooks(
                booksData
            );


            // ==================================================
            // SUCCESS MESSAGE
            // ==================================================

            showMessage(
                "Admin data loaded successfully.",
                "success"
            );


            setTimeout(
                function () {

                    const box =
                        document.getElementById(
                            "message"
                        );


                    box.className =
                        "message";

                },
                3000
            );


        }
        catch (error) {


            console.error(
                "Admin dashboard error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to load admin data.",
                "error"
            );

        }

    }


    // ==================================================
    // DISPLAY USERS
    // ==================================================

    function displayUsers(
        usersData
    ) {


        const table =
            document.getElementById(
                "usersTable"
            );


        // Backend may return:
        //
        // [
        //     {...},
        //     {...}
        // ]
        //
        // OR:
        //
        // {
        //     users: [...]
        // }


        const users =
            Array.isArray(
                usersData
            )
                ? usersData
                : usersData.users || [];


        // Update user count

        document.getElementById(
            "userCount"
        ).textContent =
            users.length;


        // No users

        if (
            users.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="empty">

                        No users found.

                    </td>

                </tr>

            `;


            return;

        }


        // Create user rows

        table.innerHTML =
            users.map(
                function (user) {


                    const isAdmin =
                        user.role === "ADMIN";


                    return `

                        <tr>

                            <td>
                                ${escapeHTML(
                                    user.id
                                )}
                            </td>


                            <td>
                                ${escapeHTML(
                                    user.email
                                )}
                            </td>


                            <td>

                                <span
                                    class="${
                                        isAdmin
                                            ? "role-admin"
                                            : "role-user"
                                    }">

                                    ${escapeHTML(
                                        user.role
                                    )}

                                </span>

                            </td>


                            <td>

                                <button

                                    class="delete-btn"

                                    ${
                                        isAdmin
                                            ? "disabled"
                                            : ""
                                    }

                                    onclick="
                                        deleteUser(
                                            ${user.id}
                                        )
                                    ">

                                    🗑️ Delete

                                </button>

                            </td>

                        </tr>

                    `;

                }
            ).join("");

    }


    // ==================================================
    // DISPLAY BOOKS
    // ==================================================

    function displayBooks(
        booksData
    ) {


        const table =
            document.getElementById(
                "booksTable"
            );


        const books =
            Array.isArray(
                booksData
            )
                ? booksData
                : booksData.books || [];


        // Update book count

        document.getElementById(
            "bookCount"
        ).textContent =
            books.length;


        // No books

        if (
            books.length === 0
        ) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="3"
                        class="empty">

                        No books found.

                    </td>

                </tr>

            `;


            return;

        }


        // Create book rows

        table.innerHTML =
            books.map(
                function (book) {


                    return `

                        <tr>

                            <td>
                                ${escapeHTML(
                                    book.id
                                )}
                            </td>


                            <td>
                                ${escapeHTML(
                                    book.title
                                )}
                            </td>


                            <td>
                                ${escapeHTML(
                                    book.userId
                                )}
                            </td>

                        </tr>

                    `;

                }
            ).join("");

    }


    // ==================================================
    // DELETE USER
    // ==================================================

    async function deleteUser(
        userId
    ) {


        const confirmed =
            confirm(
                `Are you sure you want to delete user ${userId}?`
            );


        if (!confirmed) {

            return;

        }


        try {


            const result =
                await apiRequest(
                    `${API_URL}/api/users/${userId}`,
                    {

                        method: "DELETE",

                        headers: {

                            "Authorization":
                                `Bearer ${token}`

                        }

                    }
                );


            const data =
                result.data;


            showMessage(
                data.message ||
                "User deleted successfully.",
                "success"
            );


            // Reload data

            await loadData();


        }
        catch (error) {


            console.error(
                "Delete user error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to delete user.",
                "error"
            );

        }

    }


    // ==================================================
    // LOGOUT
    // ==================================================

    async function logout() {


        try {


            await fetch(
                `${API_URL}/api/logout`,
                {

                    method: "POST",

                    headers: {

                        "Authorization":
                            `Bearer ${token}`

                    }

                }
            );

        }
        catch (error) {


            console.error(
                "Logout error:",
                error
            );

        }


        // Clear authentication data

        localStorage.removeItem(
            "accessToken"
        );


        localStorage.removeItem(
            "refreshToken"
        );


        localStorage.removeItem(
            "userRole"
        );


        // Return to login page

        window.location.href =
            "index.html";

    }


    // ==================================================
    // INITIAL LOAD
    // ==================================================

    loadData();

</script>


</body>

</html>
